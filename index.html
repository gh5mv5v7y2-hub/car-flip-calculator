<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Car Flip Calculator</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="script.js"
    defer
  ></script>
</head>

<body>

  <div class="calculator">

    <h1>Car Flip Calculator</h1>

    <p class="hint">
      Calculate risk, profit and what you should actually offer.
    </p>

    <label>Vehicle</label>

    <input
      id="carName"
      type="text"
      placeholder="Example: 2010 Dodge Journey SE"
    >


    <label>Mileage</label>

    <input
      id="mileage"
      type="number"
      min="0"
      placeholder="Example: 165000"
    >


    <label>Purchase / Asking Price</label>

    <input
      id="buyPrice"
      type="number"
      min="0"
      placeholder="Example: 1500"
    >


    <h3>Repair Estimate</h3>


    <label>Best Case</label>

    <input
      id="repairBest"
      type="number"
      min="0"
      placeholder="Example: 100"
    >


    <label>Likely Case</label>

    <input
      id="repairLikely"
      type="number"
      min="0"
      placeholder="Example: 500"
    >


    <label>Worst Case</label>

    <input
      id="repairWorst"
      type="number"
      min="0"
      placeholder="Example: 1500"
    >


    <label>Taxes / Fees</label>

    <input
      id="fees"
      type="number"
      min="0"
      placeholder="Optional"
    >


    <label>Expected Sale Price</label>

    <input
      id="salePrice"
      type="number"
      min="0"
      placeholder="Enter if known"
    >


    <label>Target Profit</label>

    <input
      id="targetProfit"
      type="number"
      min="0"
      placeholder="Example: 1000"
    >


    <button id="calculateButton">
      Calculate
    </button>

    <button id="saveButton">
      Save Deal
    </button>

    <button
      id="cancelEditButton"
      class="hidden"
    >
      Cancel Edit
    </button>


    <div id="result">
      Enter what you know
    </div>


    <div id="comparison"></div>


    <label>Sort Saved Deals</label>

    <select id="sortDeals">

      <option value="default">
        Saved Order
      </option>

      <option value="risk">
        Lowest Risk
      </option>

      <option value="score">
        Best Deal Score
      </option>

      <option value="roi">
        Best Likely ROI
      </option>

      <option value="profit">
        Highest Likely Profit
      </option>

      <option value="purchase">
        Lowest Purchase Price
      </option>

      <option value="investment">
        Lowest Likely Investment
      </option>

      <option value="mileage">
        Lowest Mileage
      </option>

    </select>


    <h2>Saved Deals</h2>

    <div id="savedDeals"></div>

  </div>

</body>
</html>
